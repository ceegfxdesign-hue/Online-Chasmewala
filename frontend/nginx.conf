server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Security response headers
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=*" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://checkout.razorpay.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https://images.unsplash.com https://res.cloudinary.com https://cdn.corenexis.com https://cdn.imageurlgenerator.com https://*.razorpay.com; media-src 'self' data: blob:; connect-src 'self' https://onlinechasmewala.com https://api.razorpay.com https://fonts.googleapis.com https://fonts.gstatic.com; frame-src 'self' https://api.razorpay.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests;" always;

  # Gzip static assets
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Block hidden files/directories except .well-known
  location ~ /\.(?!well-known) {
    deny all;
    return 404;
  }

  # Return 404 for missing static files with extensions instead of rewriting to index.html
  location ~* \.(?:ico|css|js|gif|jpe?g|png|svg|woff2?|eot|ttf|otf|mp4|webm|wav|mp3|m4a|aac|oga|txt|xml|json|zip|tar|gz|bak|pdf|map)$ {
    try_files $uri =404;
  }

  # Long-cache hashed assets
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # SPA fallback — extensionless routes resolve to index.html
  location / {
    try_files $uri $uri/ /index.html;
  }
}

